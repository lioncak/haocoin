<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jelly Fuel Pipeline</title>
<style>
  :root { color-scheme: dark; background:#031127; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#031127; }
  body { display:grid; place-items:start center; overflow-x:hidden; }
  .machine { display:block; width:min(100%, 700px); height:auto; background:#071c40; }
  @media (prefers-reduced-motion: reduce) { .machine * { animation:none !important; } }
</style>
</head>
<body>
<svg class="machine" viewBox="0 0 700 1700" role="img" aria-label="果凍沙漏與三條能量玻璃管線" xmlns="http://www.w3.org/2000/svg">

  <linearGradient id="glass" x2="1"><stop stop-color="#07305d"/><stop offset=".15" stop-color="#35b4ed"/><stop offset=".34" stop-color="#d0f8ff"/><stop offset=".55" stop-color="#47c5f6"/><stop offset=".78" stop-color="#116da9"/><stop offset="1" stop-color="#06294f"/></linearGradient>
  <linearGradient id="jelly" x2=".8" y2="1"><stop stop-color="#d5fdff"/><stop offset=".2" stop-color="#4cf4ff"/><stop offset=".55" stop-color="#19b8f1"/><stop offset="1" stop-color="#076fce"/></linearGradient>
  <linearGradient id="orange" x2="0" y2="1"><stop stop-color="#ffd080"/><stop offset=".24" stop-color="#ff9234"/><stop offset=".6" stop-color="#ff5713"/><stop offset="1" stop-color="#9d2807"/></linearGradient>
  <linearGradient id="fuel" x2="1"><stop stop-color="#809300"/><stop offset=".28" stop-color="#dfff00"/><stop offset=".5" stop-color="#ffffb9"/><stop offset=".72" stop-color="#eaff12"/><stop offset="1" stop-color="#8ca300"/></linearGradient>
  <linearGradient id="glass-vertical" gradientUnits="userSpaceOnUse" x1="311" x2="389"><stop stop-color="#07305d"/><stop offset=".18" stop-color="#39b7ed"/><stop offset=".42" stop-color="#d0f8ff"/><stop offset=".65" stop-color="#3fb8ed"/><stop offset="1" stop-color="#06294f"/></linearGradient>
  <linearGradient id="fuel-vertical" gradientUnits="userSpaceOnUse" x1="332" x2="368"><stop stop-color="#809300"/><stop offset=".25" stop-color="#ddff00"/><stop offset=".5" stop-color="#ffffc2"/><stop offset=".75" stop-color="#dfff00"/><stop offset="1" stop-color="#7e9300"/></linearGradient>
  <radialGradient id="joint" cx="34%" cy="22%"><stop stop-color="#e5fbff"/><stop offset=".28" stop-color="#99dcff"/><stop offset=".7" stop-color="#217fc0"/><stop offset="1" stop-color="#0c3d7d"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="24"/></filter>
  <clipPath id="hourglass-clip"><rect x="190" y="160" width="320" height="430" rx="60"/></clipPath>
</defs>

<ellipse cx="120" cy="500" rx="185" ry="275" fill="#0d67bd" opacity=".18" filter="url(#soft)"/>
<ellipse cx="610" cy="1190" rx="170" ry="245" fill="#156bbb" opacity=".22" filter="url(#soft)"/>
<g opacity=".68">

  <path d="M-38 139H66Q115 139 115 72V-30" fill="none" stroke="#bcf9ff" stroke-width="8" stroke-linecap="round" opacity=".7"/>

  <path d="M747 98H627Q567 98 567 176V250" fill="none" stroke="url(#glass)" stroke-width="57" stroke-linecap="round"/>
  <path d="M740 81H633Q587 81 587 176V243" fill="none" stroke="#c8fbff" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <path d="M720 1420Q628 1420 628 1515V1730" fill="none" stroke="#031127" stroke-width="72"/><path d="M720 1420Q628 1420 628 1515V1730" fill="none" stroke="url(#glass)" stroke-width="56"/>
</g>
<!-- orange and yellow hydraulic ribbons -->
<g fill="none" stroke-linecap="round" opacity=".58">

  <path d="M-35 635C100 555 130 705 248 630S435 553 720 665" stroke="#ff9e40" stroke-width="10"/>

  <path d="M-35 710C100 630 130 780 248 705S435 628 720 740" stroke="#7fc9f4" stroke-width="7" opacity=".7"/>
</g>
<g fill="#9af5ff" opacity=".72"><circle cx="102" cy="378" r="9"/><circle cx="82" cy="422" r="5"/><circle cx="601" cy="518" r="7"/><circle cx="638" cy="552" r="12"/><circle cx="66" cy="1130" r="9"/></g>

<!-- Hourglass: cyan cylindrical glass with thick rubber seal -->
<g id="hourglass-shell">
  <ellipse cx="350" cy="154" rx="162" ry="52" fill="#031530" opacity=".76"/>
  <rect x="184" y="146" width="332" height="58" rx="29" fill="#07264c"/>
  <rect x="193" y="151" width="314" height="46" rx="23" fill="url(#glass)"/>
  <ellipse cx="350" cy="156" rx="132" ry="22" fill="#d8faff" opacity=".63"/>
  <rect x="196" y="184" width="308" height="400" rx="48" fill="#061d42" stroke="#8eeeff" stroke-width="10"/>
  <rect x="205" y="193" width="290" height="382" rx="42" fill="url(#glass)" opacity=".81"/>
  <g clip-path="url(#hourglass-clip)">
    <path id="jelly-top-mass" d="M218 256 C258 221 305 212 350 229 C395 212 442 221 482 256 L482 292 C443 307 405 330 378 364 C366 379 359 390 350 402 C341 390 334 379 322 364 C295 330 257 307 218 292 Z" fill="url(#jelly)" opacity=".88"/>
    <path id="jelly-neck" d="M322 363 C334 379 341 390 350 405 C359 390 366 379 378 363 C373 390 365 412 350 430 C335 412 327 390 322 363Z" fill="#42eaff" opacity=".91"/>
    <path id="jelly-bottom-mass" d="M350 426 C370 447 388 470 421 492 C443 507 465 520 482 534 L482 564 L218 564 L218 534 C235 520 257 507 279 492 C312 470 330 447 350 426Z" fill="url(#jelly)" opacity=".9"/>
    <path id="jelly-top-wave" fill="none" stroke="#d7ffff" stroke-width="7" stroke-linecap="round" opacity=".82"/>
    <path id="jelly-bottom-wave" fill="none" stroke="#d7ffff" stroke-width="7" stroke-linecap="round" opacity=".82"/>
    <g fill="none" stroke="#c5ffff" stroke-width="4" opacity=".7"><circle cx="285" cy="273" r="10"/><circle cx="402" cy="279" r="7"/><circle cx="326" cy="477" r="9"/><circle cx="410" cy="526" r="13"/><circle cx="365" cy="500" r="5"/></g>
  </g>
  <path d="M227 207V545" stroke="#d9ffff" stroke-width="11" stroke-linecap="round" opacity=".48"/>
  <path d="M478 212V526" stroke="#0a5a9a" stroke-width="13" stroke-linecap="round" opacity=".56"/>
  <rect x="184" y="556" width="332" height="58" rx="29" fill="#07264c"/>
  <rect x="193" y="563" width="314" height="45" rx="22" fill="url(#glass)"/>
  <rect x="188" y="180" width="324" height="22" rx="11" fill="url(#orange)"/>
  <rect x="188" y="557" width="324" height="22" rx="11" fill="url(#orange)"/>
  <ellipse cx="350" cy="588" rx="145" ry="19" fill="#b1f5ff" opacity=".45"/>
</g>
<!-- neck droplet -->
<path id="neck-droplet" d="M350 394C329 423 329 442 350 455C371 442 371 423 350 394Z" fill="#55f2ff" filter="url(#glow)"/>

<!-- outlet and central distributor -->
<g>
  <path d="M350 612V768" stroke="#031127" stroke-width="78"/><path d="M350 612V768" stroke="url(#glass-vertical)" stroke-width="58"/><path d="M350 612V768" stroke="#e3ff16" stroke-width="24" filter="url(#glow)"/>
  <circle cx="350" cy="790" r="76" fill="#06254d"/><circle cx="350" cy="790" r="62" fill="url(#joint)"/><circle cx="350" cy="790" r="29" fill="url(#orange)"/><circle cx="340" cy="779" r="9" fill="#ffd19a" opacity=".75"/>
</g>
<!-- exactly three round transparent glass pipes: each exits screen at a different x -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path id="pipe-left" d="M300 812 C251 817 193 835 169 880 C147 920 181 1006 150 1125 C125 1225 144 1458 112 1738" stroke="#031127" stroke-width="74"/>
  <path d="M300 812 C251 817 193 835 169 880 C147 920 181 1006 150 1125 C125 1225 144 1458 112 1738" stroke="url(#glass)" stroke-width="56"/>
  <path id="fuel-left" d="M300 812 C251 817 193 835 169 880 C147 920 181 1006 150 1125 C125 1225 144 1458 112 1738" stroke="url(#fuel)" stroke-width="23" filter="url(#glow)"/>
  <path id="pipe-right" d="M400 812 C448 817 506 835 531 880 C553 920 519 1008 551 1130 C579 1238 547 1458 589 1738" stroke="#031127" stroke-width="74"/>
  <path d="M400 812 C448 817 506 835 531 880 C553 920 519 1008 551 1130 C579 1238 547 1458 589 1738" stroke="url(#glass)" stroke-width="56"/>
  <path id="fuel-right" d="M400 812 C448 817 506 835 531 880 C553 920 519 1008 551 1130 C579 1238 547 1458 589 1738" stroke="url(#fuel)" stroke-width="23" filter="url(#glow)"/>
  <path id="pipe-stem" d="M350 856 C331 946 380 1044 350 1150 C326 1240 378 1434 344 1738" stroke="#031127" stroke-width="76"/>
  <path d="M350 856 C331 946 380 1044 350 1150 C326 1240 378 1434 344 1738" stroke="url(#glass-vertical)" stroke-width="58"/>
  <path id="fuel-stem" d="M350 856 C331 946 380 1044 350 1150 C326 1240 378 1434 344 1738" stroke="#e3ff16" stroke-width="25" filter="url(#glow)"/>
</g>
<g fill="#e6ff24" filter="url(#glow)"><ellipse id="flow-left" cx="238" cy="826" rx="13" ry="8"/><ellipse id="flow-right" cx="462" cy="826" rx="13" ry="8"/><ellipse id="flow-stem" cx="350" cy="965" rx="8" ry="13"/></g>
<path d="M-28 1530Q105 1395 182 1550" fill="none" stroke="#ff9c31" stroke-width="18" opacity=".82"/><path d="M-28 1570Q105 1435 182 1590" fill="none" stroke="#fff13a" stroke-width="12" opacity=".82"/>
</svg>
<script>
  class JellyHourglass {
    constructor(svg) {
      this.svg = svg;
      this.remaining = 42;
      this.total = 58;
      this.used = this.total - this.remaining;
      this.displayRatio = this.remaining / this.total;
      this.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      this.top = svg.querySelector('#jelly-top-wave');
      this.bottom = svg.querySelector('#jelly-bottom-wave');
      this.topMass = svg.querySelector('#jelly-top-mass');
      this.bottomMass = svg.querySelector('#jelly-bottom-mass');
      this.neck = svg.querySelector('#jelly-neck');
      this.droplet = svg.querySelector('#neck-droplet');
      this.flows = ['#flow-left', '#flow-right', '#flow-stem'].map((id) => svg.querySelector(id));
      this.tick = this.tick.bind(this);
      if (this.reduced) this.tick(0); else requestAnimationFrame(this.tick);
    }
    setProgress(remaining, total = this.total) {
      this.remaining = Math.max(0, Math.min(remaining, total));
      this.total = total;
      this.used = total - this.remaining;
    }
    wavePath(y, amplitude, phase) {
      let d = `M 230 ${y}`;
      for (let x = 230; x <= 470; x += 8) {
        const wave = Math.sin((x / 32) + phase) * amplitude;
        d += ` L ${x} ${(y + wave).toFixed(2)}`;
      }
      return d;
    }
    tick(ms) {
      const target = this.remaining / this.total;
      this.displayRatio += (target - this.displayRatio) * .035;
      const phase = ms / 700;
      const topY = 250 + (1 - this.displayRatio) * 28;
      const bottomY = 538 - (1 - this.displayRatio) * 16;
      this.top.setAttribute('d', this.wavePath(topY, 5, phase));
      this.bottom.setAttribute('d', this.wavePath(bottomY, 6, -phase * 1.2));
      const topScale = .62 + this.displayRatio * .38;
      const bottomScale = .65 + (1 - this.displayRatio) * .35;
      this.topMass.setAttribute('transform', `translate(350 405) scale(1 ${topScale.toFixed(3)}) translate(-350 -405)`);
      this.neck.setAttribute('transform', `translate(350 405) scale(1 ${topScale.toFixed(3)}) translate(-350 -405)`);
      this.bottomMass.setAttribute('transform', `translate(350 430) scale(1 ${bottomScale.toFixed(3)}) translate(-350 -430)`);
      const dropletY = 398 + ((ms % 900) / 900) * 62;
      this.droplet.setAttribute('transform', `translate(0 ${(this.reduced ? 24 : dropletY - 398).toFixed(1)}) scale(.78)`);
      this.flows.forEach((node, index) => {
        const offset = Math.sin(phase * 2 + index * 2.1) * 16;
        node.setAttribute('opacity', (.65 + Math.sin(phase + index) * .35).toFixed(2));
        node.setAttribute('transform', index === 0 ? `translate(${offset} 0)` : index === 1 ? `translate(${-offset} 0)` : `translate(0 ${offset})`);
      });
      if (!this.reduced) requestAnimationFrame(this.tick);
    }
  }
  window.jellyHourglass = new JellyHourglass(document.querySelector('.machine'));
</script>
</body></html>
